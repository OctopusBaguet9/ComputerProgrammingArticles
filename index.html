<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Text Share</title>
    <!-- FIX: Updated with the correct, full Supabase CDN URL -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; }
        .post { border-bottom: 1px solid #eee; padding: 15px 0; }
    </style>
</head>
<body>

    <h1>Public Text Share</h1>
         
    <!-- Input Form -->
    <form id="textForm">
        <textarea id="textContent" placeholder="Enter text or HTML here..." required></textarea>
        <button type="submit">Publish Publicly</button>
    </form>

    <!-- Live Feed -->
    <h2>Live Feed</h2>
    <div id="feed">Loading posts...</div>

    <script>
        // 1. Configure Supabase
        const SUPABASE_URL = "https://qttpacqvxorqbjvsebsu.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF0dHBhY3F2eG9ycWJqdnNlYnN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMjAyODEsImV4cCI6MjEwMzg5NjI4MX0.couWusAvItKzLQXx-Xifp5TEMnNSs7vQ0nJTjFh4Z_0";
        
        // FIX: The CDN exposes it under the global variable `supabase`
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const form = document.getElementById('textForm');
        const contentInput = document.getElementById('textContent');
        const feedDiv = document.getElementById('feed');

        // 2. Fetch existing posts on load
        async function fetchPosts() {
            const { data, error } = await supabaseClient
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });
                        
            if (error) {
                console.error(error);
                feedDiv.innerHTML = "Error loading posts. Check console.";
            } else {
                renderFeed(data);
            }
        }

        // 3. Render posts to the DOM
        function renderFeed(posts) {
            if (!posts || posts.length === 0) {
                feedDiv.innerHTML = "No posts found.";
                return;
            }
            feedDiv.innerHTML = posts.map(post => `
                <div class="post">
                    <small>${new Date(post.created_at).toLocaleString()}</small>
                    <div>${post.content}</div>
                </div>
            `).join('');
        }

        // 4. Handle text submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = contentInput.value;

            const { error } = await supabaseClient
                .from('posts')
                .insert([{ content: text }]);

            if (error) {
                alert('Error uploading: ' + error.message);
            } else {
                contentInput.value = ''; // Clear input
            }
        });

        // 5. Listen for Live Realtime Updates
        supabaseClient
            .channel('schema-db-changes')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'posts' }, (payload) => {
                fetchPosts();
            })
            .subscribe();

        // Initial Load
        fetchPosts();
    </script>
</body>
</html>
